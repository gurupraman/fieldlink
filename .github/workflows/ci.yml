name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race

  # Runs the real test suite natively on Windows. Compiling for windows/amd64
  # (in cross-compile, below) only proves the code builds there; this job is
  # what actually proves it runs — cross-compilation from Linux can't catch
  # a runtime-only Windows issue (path handling, signal semantics, etc).
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: go test
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
          - goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - goos: windows
            goarch: amd64
            goarm: ""
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build (CGO_ENABLED=0, matches design.md's non-negotiable constraint)
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          out=fieldlink-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}${{ matrix.ext }}
          go build -ldflags="-s -w" -o "$out" ./cmd/fieldlink
          file "$out"
          ls -la "$out"
