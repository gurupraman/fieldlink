# Local development config — stdio transport, enforced by the example
# signed grant in examples/grants/dev/ (fs.read + fs.list, scoped to /tmp).
# See examples/grants/dev/grant.yaml for how to sign your own.
agent_id: fieldlink-dev

server:
  transport: stdio

grant:
  path: examples/grants/dev/grant.yaml
  trusted_key: examples/grants/dev/trusted.pub

audit:
  path: /tmp/fieldlink-dev-audit.jsonl
  rotate_mb: 128
